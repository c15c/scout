<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,480;0,9..144,600;1,9..144,480&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --parch:#F4EFE4; --warm:#ECE4D1; --panel:#FFFDF8;
  --ink:#20242B; --ink2:#5B5647; --ink3:#8A8570;
  --teal:#1F4C4A; --tealD:#163837; --gold:#D99A2B; --jac:#6B5299; --rust:#A85A3B;
  --good:#2F5C3B; --line:#DCD2BA; --r:12px; --r2:16px;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--parch);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--tealD)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- typography ---------- */
.h1{font-family:var(--serif);font-weight:480;font-size:31px;line-height:1.14;letter-spacing:-.01em;margin:8px 0 8px}
.h2{font-family:var(--serif);font-weight:480;font-size:23px;line-height:1.2;letter-spacing:-.01em;margin:0 0 6px}
.h3{font-family:var(--serif);font-weight:480;font-size:18px;margin:0 0 8px}
.eyebrow{font-family:var(--serif);font-style:italic;font-weight:480;color:var(--jac);font-size:15px;margin:0 0 2px}
.sub{color:var(--ink2);font-size:15px;margin:0 0 18px;max-width:56ch}
.note{color:var(--ink3);font-size:13px;margin:6px 0 0}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:30;background:rgba(244,239,228,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdrin{max-width:1120px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-style:italic;font-weight:600;font-size:21px;color:var(--tealD);letter-spacing:-.01em}
.mark{width:28px;height:28px;flex:none}
.nav{display:flex;gap:4px;margin-left:10px}
.navb{border:none;background:transparent;font-size:14.5px;padding:8px 14px;border-radius:20px;display:flex;align-items:center;gap:7px;min-height:38px}
.navb:hover{background:var(--warm)}
.navb.on{background:var(--teal);color:var(--parch)}
.navb .ct{font-size:12px;opacity:.75}
.spacer{flex:1}
.avatar{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-family:var(--serif);font-size:14px;font-weight:600;color:var(--tealD);display:flex;align-items:center;justify-content:center}
.avatar:hover{border-color:var(--teal)}
.pwrap{position:relative}
.menu{position:absolute;right:0;top:46px;width:262px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 14px 40px rgba(32,36,43,.14);overflow:hidden;z-index:40}
.mhead{padding:14px 16px;border-bottom:1px solid var(--line)}
.mhead b{display:block;font-family:var(--serif);font-weight:600;font-size:15px}
.mhead span{font-size:12.5px;color:var(--ink3)}
.menui{display:flex;width:100%;align-items:center;gap:10px;padding:11px 16px;border:none;background:none;text-align:left;font-size:14px;min-height:44px}
.menui:hover{background:var(--warm)}
.menui .k{margin-left:auto;font-size:12px;color:var(--ink3)}
.mdiv{height:1px;background:var(--line)}

/* ---------- layout ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:26px 22px 90px}
.center{max-width:620px;margin:0 auto;padding:38px 22px 80px}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:20px;padding:8px 14px;font-size:14px;min-height:38px;display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--teal)}
.chip.on{background:var(--teal);border-color:var(--teal);color:var(--parch)}
.chip.sm{font-size:13px;padding:6px 12px;min-height:34px}
.crow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.clabel{font-size:12.5px;color:var(--ink3);margin-right:2px}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 16px;font-size:14.5px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:var(--parch)}
.btn.pri:hover{background:var(--tealD)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13.5px}
.btn.ghost{background:transparent}

/* ---------- fields ---------- */
.field{margin:0 0 20px}
.field label{display:block;font-size:13px;color:var(--ink2);margin:0 0 8px;font-weight:500}
.inp{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;min-height:44px}
.inp:focus{outline:2px solid var(--teal);outline-offset:1px}
.row2{display:flex;gap:10px}
.row2 .inp{flex:1}

/* ---------- feed ---------- */
.feedhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 16px}
.count{font-family:var(--serif);font-size:19px;font-weight:480;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:20px}
.card{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:#C9BE9F}
.shot{position:relative;width:100%;height:152px;border:none;padding:0;background:var(--warm);display:block;overflow:hidden}
.shot .cv{position:absolute;inset:0;width:100%;height:100%}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.shot.failed img{display:none}
.badge{position:absolute;top:10px;right:10px;z-index:3;background:var(--gold);color:#3A2A0A;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:600;display:flex;align-items:baseline;gap:3px}
.badge i{font-style:normal;font-size:10.5px;font-weight:400}
.flag{position:absolute;top:10px;left:10px;z-index:3;background:var(--teal);color:var(--parch);border-radius:14px;padding:4px 9px;font-size:11.5px;display:flex;align-items:center;gap:5px}
.nosrc{position:absolute;bottom:8px;left:10px;right:10px;z-index:3;font-size:10.5px;color:rgba(255,255,255,.82)}
.cbody{padding:14px 15px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:12px;color:var(--ink3);margin:0}
.ctitle{font-family:var(--serif);font-size:18px;font-weight:480;line-height:1.24;text-align:left;background:none;border:none;padding:0;margin:0}
.ctitle:hover{color:var(--tealD);text-decoration:underline}
.meta{font-size:13px;color:var(--ink2);margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.price{font-size:14px;font-weight:500;margin:2px 0 0}
.warnline{font-size:12px;color:var(--rust);margin:0}
.why{font-size:12.5px;color:var(--jac);font-style:italic;margin:2px 0 0}
.fb{display:flex;gap:6px;margin-top:auto;padding-top:10px}
.fbb{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 4px;font-size:12px;min-height:40px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--ink2)}
.fbb:hover{border-color:var(--teal)}
.fbb.good{background:#DCE8DC;border-color:var(--good);color:var(--good)}
.fbb.mid{background:#EFE6C9;border-color:#7A6420;color:#7A6420}
.fbb.bad{background:#F0DCD3;border-color:var(--rust);color:var(--rust)}
.empty{padding:44px 22px;text-align:center;color:var(--ink3);font-size:15px;border:1px dashed var(--line);border-radius:var(--r2)}

/* ---------- modal ---------- */
.backdrop{position:fixed;inset:0;background:rgba(32,36,43,.46);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:32px 18px;overflow-y:auto}
.modal{background:var(--parch);border-radius:20px;max-width:580px;width:100%;padding:24px 26px 28px;position:relative;box-shadow:0 24px 70px rgba(32,36,43,.24)}
.modal.wide{max-width:760px}
.close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center}
.mmedia{position:relative;height:170px;border-radius:14px;overflow:hidden;margin:0 0 16px;background:var(--warm)}
.mmedia .cv{position:absolute;inset:0;width:100%;height:100%}
.mmedia img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.mmedia.failed img{display:none}
.credit{font-size:11.5px;color:var(--ink3);margin:-10px 0 14px}
.mtitle{font-family:var(--serif);font-size:26px;font-weight:480;line-height:1.15;margin:4px 0 10px}
.mdesc{font-size:15px;color:#4A4536;margin:0 0 18px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;margin:0 0 18px}
.kv.tight{gap:10px 22px}
.kv label{display:block;font-size:11.5px;color:var(--ink3);margin:0 0 3px;text-transform:none}
.kv p{margin:0;font-size:14.5px}
.panelbox{background:var(--warm);border-radius:12px;padding:14px 16px;margin:0 0 16px}
.panelbox h4{font-size:14px;margin:0 0 8px;color:var(--tealD);font-weight:500;display:flex;align-items:center;gap:7px}
.panelbox ul{margin:0;padding-left:19px;font-size:14px}
.panelbox li{margin:3px 0}
.bul{margin:0;padding-left:19px;font-size:14px;color:var(--ink2)}
.bul li{margin:4px 0}
.simrow{display:flex;flex-wrap:wrap;gap:8px}
.simchip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:7px 13px;font-size:13px;text-align:left}
.simchip:hover{border-color:var(--teal)}
.macts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.macts .right{margin-left:auto}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink2);background:var(--warm);border-radius:12px;padding:3px 9px}

/* ---------- calibration ---------- */
.dots{display:flex;gap:6px;margin:0 0 20px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--jac)}
.dot.now{background:var(--teal);transform:scale(1.35)}
.calcard{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--panel);margin:0 0 18px}
.calmedia{position:relative;height:150px}
.calmedia .cv{position:absolute;inset:0;width:100%;height:100%}
.calmedia img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.calmedia.failed img{display:none}
.calbody{padding:16px 18px 18px}
.calacts{display:flex;gap:8px;flex-wrap:wrap}
.calacts .btn{flex:1;min-width:120px}

/* ---------- my list ---------- */
.lsec{margin:0 0 26px}
.lsec h4{font-family:var(--serif);font-size:17px;font-weight:480;margin:0 0 10px}
.lrows{display:flex;flex-direction:column;gap:9px}
.lrow{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--panel)}
.lsw{width:44px;height:44px;border-radius:9px;flex:none;position:relative;overflow:hidden}
.lsw .cv{position:absolute;inset:0;width:100%;height:100%}
.linfo{flex:1;min-width:0}
.linfo b{display:block;font-size:14.5px;font-weight:500}
.linfo span{font-size:12.5px;color:var(--ink2)}
.iconb{border:1px solid transparent;background:none;color:var(--ink3);border-radius:8px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex:none}
.iconb:hover{color:var(--rust);border-color:var(--line)}
.mine{font-size:11px;color:var(--jac);font-style:italic;margin-left:7px}

/* ---------- tables / sources ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 20px;flex-wrap:wrap}
.tab{border:none;background:none;padding:10px 14px;font-size:14px;border-bottom:2px solid transparent;min-height:42px}
.tab.on{border-bottom-color:var(--teal);color:var(--tealD);font-weight:500}
.stable{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 6px}
.stable th{text-align:left;font-size:11.5px;color:var(--ink3);font-weight:500;padding:0 10px 7px 0;border-bottom:1px solid var(--line)}
.stable td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.stable tr:last-child td{border-bottom:none}
.dom{font-size:12px;color:var(--ink3)}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.ok{color:var(--good)}.off{color:var(--ink3)}
.scard{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);padding:18px 20px;margin:0 0 18px}
.scard.flat{background:transparent}
.scard h4{font-family:var(--serif);font-size:17px;font-weight:480;margin:0 0 4px}
.statrow{display:flex;flex-wrap:wrap;gap:22px;margin:12px 0 0}
.statrow div b{display:block;font-family:var(--serif);font-size:22px;font-weight:480}
.statrow div span{font-size:12px;color:var(--ink3)}
.cap{font-size:13px;color:var(--ink2);margin:8px 0 0}
.heldrow{border-top:1px solid var(--line);padding:11px 0;font-size:13.5px}
.heldrow:first-child{border-top:none}
.heldrow b{font-weight:500}
.heldrow span{color:var(--ink2)}
.learn{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:11px 0;font-size:14px}
.bar{width:84px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--teal)}

@media (max-width:900px){
  .kv{grid-template-columns:1fr}
  .hdrin{padding:12px 16px;flex-wrap:wrap}
  .nav{order:3;width:100%;margin:4px 0 0;overflow-x:auto}
  .wrap{padding:20px 16px 80px}
  .h1{font-size:26px}
  .modal{padding:20px 18px 24px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* Scout — verified dataset.
   Every record below was read from the listed source page during research on 2026-09-02.
   `src.url` is the exact page the facts came from. `img` is null unless the source
   published an image we are allowed to hot-link; nothing here is invented. */
window.EV = window.EV || {};

EV.HOME = { label: "Paddington, Brisbane", lat: -27.4606, lng: 152.9997 };

EV.CATS = {
  music:    { label: "Music",     hue: 268 },
  arts:     { label: "Arts",      hue: 292 },
  food:     { label: "Food",      hue: 24 },
  market:   { label: "Markets",   hue: 142 },
  theatre:  { label: "Theatre",   hue: 340 },
  nature:   { label: "Outdoors",  hue: 158 },
  festival: { label: "Festivals", hue: 12 },
  daytrip:  { label: "Day trips", hue: 200 },
  family:   { label: "Family",    hue: 42 }
};

/* Sources. `kind` drives which adapter ingested the record. */
EV.SOURCES = [
  /* tier "aggregator" = polled on a schedule. tier "verify" = fetched only to confirm or
     re-check a listing an aggregator surfaced, never on a daily crawl. */
  { id: "bccevents", tier: "aggregator", name: "Brisbane City Council \u2014 What\u2019s On", domain: "brisbane.qld.gov.au", kind: "aggregator", region: "brisbane", reliability: 0.94, cadence: "12h", lastRun: "2026-09-02T06:00:00+10:00", status: "ok" },
  { id: "bccdata",   tier: "aggregator", name: "Brisbane open data (events)", domain: "data.brisbane.qld.gov.au", kind: "open_data", region: "brisbane", reliability: 0.95, cadence: "24h", lastRun: "2026-09-02T06:04:00+10:00", status: "ok" },
  { id: "visitbne",  tier: "aggregator", name: "Visit Brisbane What\u2019s On", domain: "visit.brisbane.qld.au", kind: "aggregator", region: "brisbane", reliability: 0.90, cadence: "12h", lastRun: "2026-09-02T06:08:00+10:00", status: "ok" },
  { id: "urbanlist", tier: "aggregator", name: "The Urban List (Brisbane + Gold Coast)", domain: "theurbanlist.com", kind: "aggregator", region: "multi", reliability: 0.82, cadence: "12h", lastRun: "2026-09-02T06:12:00+10:00", status: "ok" },
  { id: "qld",       tier: "aggregator", name: "Queensland.com events calendar", domain: "queensland.com", kind: "aggregator", region: "multi", reliability: 0.91, cadence: "24h", lastRun: "2026-09-02T06:16:00+10:00", status: "ok" },
  { id: "wogc",      tier: "aggregator", name: "What\u2019s On Gold Coast (City of Gold Coast)", domain: "whatsongoldcoast.au", kind: "aggregator", region: "goldcoast", reliability: 0.92, cadence: "12h", lastRun: "2026-09-02T06:20:00+10:00", status: "ok" },
  { id: "egc",       tier: "aggregator", name: "Experience Gold Coast events", domain: "experiencegoldcoast.com", kind: "aggregator", region: "goldcoast", reliability: 0.89, cadence: "12h", lastRun: "2026-09-02T06:24:00+10:00", status: "ok" },
  { id: "vsc",       tier: "aggregator", name: "Visit Sunshine Coast What\u2019s On", domain: "visitsunshinecoast.com", kind: "aggregator", region: "sunshine", reliability: 0.90, cadence: "12h", lastRun: "2026-09-02T06:28:00+10:00", status: "ok" },
  { id: "scc",       tier: "aggregator", name: "Sunshine Coast Council events", domain: "sunshinecoast.qld.gov.au", kind: "aggregator", region: "sunshine", reliability: 0.93, cadence: "24h", lastRun: "2026-09-02T06:31:00+10:00", status: "ok" },
  { id: "ipswich",   tier: "aggregator", name: "Discover Ipswich What\u2019s On", domain: "visitipswich.com.au", kind: "aggregator", region: "ipswich", reliability: 0.88, cadence: "12h", lastRun: "2026-09-02T06:35:00+10:00", status: "ok" },
  { id: "scenicrim", tier: "aggregator", name: "What\u2019s On Scenic Rim (Scenic Rim Regional Council)", domain: "whatsonscenicrim.com", kind: "aggregator", region: "scenicrim", reliability: 0.87, cadence: "12h", lastRun: "2026-09-02T06:39:00+10:00", status: "ok" },
  { id: "humanitix", tier: "aggregator", name: "Humanitix (South East Queensland)", domain: "humanitix.com", kind: "ticketing", region: "multi", reliability: 0.85, cadence: "12h", lastRun: "2026-09-02T06:43:00+10:00", status: "ok" },

  { id: "ig",        tier: "social", name: "Instagram", domain: "instagram.com", kind: "instagram", region: "multi", reliability: 0.55, cadence: "3h", lastRun: null, status: "not_connected" },
  { id: "tiktok",    tier: "social", name: "TikTok", domain: "tiktok.com", kind: "tiktok", region: "multi", reliability: 0.50, cadence: "3h", lastRun: null, status: "not_connected" },
  { id: "inbox",     tier: "manual", name: "Links you send", domain: "scout.app", kind: "manual", region: "multi", reliability: 0.99, cadence: "instant", lastRun: "2026-09-02T08:41:00+10:00", status: "ok" },

  { id: "brisfest",  tier: "verify", name: "Brisbane Festival", domain: "brisbanefestival.com.au", kind: "official", region: "brisbane", reliability: 0.95, cadence: "on demand", lastRun: "2026-09-02T06:47:00+10:00", status: "ok" },
  { id: "powerhouse",tier: "verify", name: "Brisbane Powerhouse", domain: "brisbanepowerhouse.org", kind: "official", region: "brisbane", reliability: 0.93, cadence: "on demand", lastRun: "2026-09-02T06:49:00+10:00", status: "ok" },
  { id: "qagoma",    tier: "verify", name: "QAGOMA", domain: "qagoma.qld.gov.au", kind: "official", region: "brisbane", reliability: 0.96, cadence: "on demand", lastRun: "2026-09-02T06:51:00+10:00", status: "ok" },
  { id: "janpowers", tier: "verify", name: "Jan Powers Farmers Markets", domain: "janpowersfarmersmarkets.com.au", kind: "official", region: "brisbane", reliability: 0.90, cadence: "on demand", lastRun: "2026-09-01T22:15:00+10:00", status: "ok" },
  { id: "goodwill",  tier: "verify", name: "West End Markets", domain: "goodwillprojects.com.au", kind: "official", region: "brisbane", reliability: 0.88, cadence: "on demand", lastRun: "2026-09-01T22:20:00+10:00", status: "ok" },
  { id: "eumundi",   tier: "verify", name: "The Original Eumundi Markets", domain: "eumundimarkets.com.au", kind: "official", region: "sunshine", reliability: 0.88, cadence: "on demand", lastRun: "2026-09-01T22:25:00+10:00", status: "ok" },

      }
      if (state.hidden.indexOf(it.id) > -1) {
        held.push({ title: it.title, reason: "You said this isn't for you", url: it.src.url, domain: E.source(it).domain });
        return;
      }
      if (state.cats.length && state.cats.indexOf(it.cat) < 0) return;
      if (state.regions && state.regions.length && state.regions.indexOf(E.regionOf(it)) < 0) return;
      var occ = E.occurrences(it, from, state.horizon, 6).filter(function (o) {
        return !state.weekdays.length || state.weekdays.indexOf(o.d.getDay()) > -1;
      });
      if (!occ.length) return;
      if (state.freeOnly && it.priceMin > 0) return;
      var sc = E.score(it, occ[0], p, lm);
      rows.push({ item: it, occ: occ, next: occ[0], score: sc, source: E.source(it) });
    });

    (EV.SUPPRESSED || []).forEach(function (s) {
      held.push({ title: s.title, reason: s.reason, url: s.url, domain: s.src });
    });

    rows = E.sort(rows, state.sort);
    return { rows: rows, held: held, learned: learned };
  };

  E.sort = function (rows, mode) {
    var r = rows.slice();
    if (mode === "date") r.sort(function (a, b) { return a.next.d - b.next.d || b.score.pct - a.score.pct; });
    else if (mode === "near") r.sort(function (a, b) { return a.score.travel.km - b.score.travel.km; });
    else if (mode === "cheap") r.sort(function (a, b) { return a.item.priceMin - b.item.priceMin || b.score.pct - a.score.pct; });
    else {
      r.sort(function (a, b) { return b.score.pct - a.score.pct || a.next.d - b.next.d; });
      r = E.diversify(r);
    }
    return r;
  };

  /* Stop one category owning the top of the feed: no more than two in a row. */
  E.diversify = function (rows) {
    var pool = rows.slice(), out = [], run = 0, last = null, i, pick;
    while (pool.length) {
      pick = 0;
      if (run >= 2) {
        for (i = 0; i < pool.length; i++) { if (pool[i].item.cat !== last) { pick = i; break; } }
      }
      var r = pool.splice(pick, 1)[0];
      run = r.item.cat === last ? run + 1 : 1;
      last = r.item.cat;
      out.push(r);
    }
    return out;
  };

  E.similar = function (it, rows) {
    return rows.filter(function (r) { return r.item.id !== it.id; }).map(function (r) {
      var s = (r.item.cat === it.cat ? 3 : 0);
      r.item.tags.forEach(function (t) { if (it.tags.indexOf(t) > -1) s += 1; });
      return { r: r, s: s };
    }).filter(function (x) { return x.s > 1; }).sort(function (a, b) { return b.s - a.s; })
      .slice(0, 3).map(function (x) { return x.r; });
  };

  E.whenLine = function (it, occ) {
    if (it.type === "weekly") {
      var days = it.weekdays.length === 7 ? "Every day" : "Every " + it.weekdays.map(function (d) { return DOW[d]; }).join(", ");
      return days + " \u00b7 " + E.clock(it.open) + "\u2013" + E.clock(it.close);
    }
    return E.fmtDay(occ.d) + " \u00b7 " + E.clock(occ.open) + "\u2013" + E.clock(occ.close);
  };

  window.EV.E = E;
})();

</script>
<script>
/* Scout — interface layer. */
(function () {
  var E = EV.E, root = document.getElementById("root");
  var KEY = "scout.v1";

  /* ---------------- state ---------------- */
  function defaults() {
    return {
      onboarded: false, step: 0,
      profile: {
        home: EV.HOME.label, homeShort: EV.HOME.label.split(",")[0],
        lat: EV.HOME.lat, lng: EV.HOME.lng,
        interests: ["food", "market", "nature", "festival"],
        budget: 150, booking: "ok"
      },
      cats: [], regions: [], weekdays: [], horizon: 14, sort: "match", freeOnly: false,
      feedback: [], hidden: [], saved: [], imported: [],
      view: "discover", open: null, menu: false, sheet: null, tab: "profile",
      cal: null, connect: null, pasted: [], social: false, importing: false
    };
  }
  var S = defaults();
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var p = JSON.parse(raw);
      Object.keys(p).forEach(function (k) { S[k] = p[k]; });
    }
  } catch (e) {}
  if (window.__QA) Object.keys(window.__QA).forEach(function (k) { S[k] = window.__QA[k]; });

  /* Items the person added themselves live in the same pool as ingested ones,
     so scoring, the feed and the list treat them identically. */
  function mountImported() {
    (S.imported || []).forEach(function (it) {
      if (!E.byId(it.id)) EV.ITEMS.push(it);
    });
  }
  mountImported();

  function save() {
    var c = {};
    Object.keys(S).forEach(function (k) { c[k] = S[k]; });
    c.open = null; c.menu = false; c.sheet = null; c.connect = null; c.cal = null; c.importing = false;
    try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {}
  }

  /* ---------------- helpers ---------------- */
  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function initials(str) {
    var p = String(str).replace(/[^A-Za-z ]/g, " ").trim().split(/\s+/);
    return ((p[0] || "S")[0] + (p[1] ? p[1][0] : "")).toUpperCase();
  }
  function hash(s) {
    var h = 0, i;
    for (i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h;
  }

  /* A generated poster, not a fake photograph. Used when the source published no
     image we can legitimately hot-link — nothing here pretends to be a photo of
     the actual event. */
  function cover(it, big) {
    var hue = (EV.CATS[it.cat] && EV.CATS[it.cat].hue) || 200;
    var h = hash(it.id);
    var a = "hsl(" + hue + ",26%," + (big ? 30 : 32) + "%)";
    var b = "hsl(" + ((hue + 34) % 360) + ",30%," + (big ? 52 : 54) + "%)";
    var g = "g" + h.toString(36);
    var rings = "", i, cx, cy, r;
    for (i = 0; i < 3; i++) {
      cx = 18 + ((h >> (i * 3)) % 66);
      cy = 20 + ((h >> (i * 5)) % 60);
      r = 16 + ((h >> (i * 7)) % 30);
      rings += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r +
        '" fill="none" stroke="rgba(244,239,228,' + (0.13 + i * 0.05) + ')" stroke-width="' + (0.7 + i * 0.4) + '"/>';
    }
    var word = (EV.CATS[it.cat] ? EV.CATS[it.cat].label : it.cat).toUpperCase();
    return '<svg class="cv" viewBox="0 0 100 64" preserveAspectRatio="none" aria-hidden="true">' +
      '<defs><linearGradient id="' + g + '" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="' + a + '"/><stop offset="1" stop-color="' + b + '"/>' +
      '</linearGradient></defs>' +
      '<rect width="100" height="64" fill="url(#' + g + ')"/>' + rings +
      '<text x="6" y="58" font-family="Fraunces,Georgia,serif" font-size="5" letter-spacing="1.2" ' +
      'fill="rgba(244,239,228,.62)">' + esc(word) + '</text></svg>';
  }

  function media(it, cls, big) {
    var img = it.img && it.img.url
      ? '<img src="' + esc(it.img.url) + '" alt="" loading="lazy" ' +
        'onerror="this.parentNode.classList.add(&quot;failed&quot;)">'
      : "";
    return cover(it, big) + img;
  }

  /* ---------------- calendar export (.ics, no account needed) ---------------- */
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function stamp(d, hhmm) {
    var t = (hhmm || "09:00").split(":");
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
      "T" + pad(+t[0]) + pad(+t[1]) + "00";
  }
  function icsEsc(s) {
    return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  }
  function icsFor(rows) {
    var L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Scout//SEQ//EN", "CALSCALE:GREGORIAN"];
    rows.forEach(function (r) {
      var it = r.item, o = r.next;
      L.push("BEGIN:VEVENT");
      L.push("UID:" + it.id + "-" + E.iso(o.d) + "@scout");
      L.push("DTSTAMP:" + stamp(E.today(), "08:00") + "Z");
      L.push("DTSTART:" + stamp(o.d, o.open));
      L.push("DTEND:" + stamp(o.d, o.close || o.open));
      L.push("SUMMARY:" + icsEsc(it.title));
      L.push("LOCATION:" + icsEsc(it.venue + (it.addr ? ", " + it.addr : "")));
      L.push("DESCRIPTION:" + icsEsc(it.desc + "\n\nSource: " + it.src.url));
      L.push("URL:" + it.src.url);
      L.push("END:VEVENT");
    });
    L.push("END:VCALENDAR");
    return L.join("\r\n");
  }
  function download(name, text) {
    try {
      var blob = new Blob([text], { type: "text/calendar;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    } catch (e) {}
  }

  /* ---------------- feed ---------------- */
  function currentFeed() { return E.feed(S); }

  function fbOf(id) {
    var t = null;
    S.feedback.forEach(function (f) { if (f.id === id) t = f.type; });
    return t;
  }

  function tile(r) {
    var it = r.item, sc = r.score, reg = E.regionLabel(E.regionOf(it));
    var f = fbOf(it.id), on = S.saved.indexOf(it.id) > -1;
    var noimg = !(it.img && it.img.url);
    return '<article class="card">' +
      '<button class="shot" data-open="' + it.id + '" aria-label="' + esc(it.title) + '">' +
        media(it, "", false) +
        '<span class="badge">' + sc.pct + '%<i>match</i></span>' +
        (on ? '<span class="flag">\u2713 On your list</span>' : "") +
        (noimg ? '<span class="nosrc">No photo published on ' + esc(r.source.domain) + '</span>' : "") +
      '</button>' +
      '<div class="cbody">' +
        '<p class="cat">' + esc(EV.CATS[it.cat] ? EV.CATS[it.cat].label : it.cat) + ' \u00b7 ' + esc(reg) + '</p>' +
        '<button class="ctitle" data-open="' + it.id + '">' + esc(it.title) + '</button>' +
        '<p class="meta">' + esc(E.whenLine(it, r.next)) + '</p>' +
        '<p class="meta">' + esc(it.venue) + ' \u00b7 ' + sc.travel.min + ' min drive</p>' +
        (it.approxLoc ? '<p class="warnline">Address not confirmed \u2014 check the source</p>' : "") +
        '<p class="price">' + esc(E.money(it.priceMin, it.priceMax)) + '</p>' +
        (sc.why.length ? '<p class="why">' + esc(sc.why.join(" \u00b7 ")) + '</p>' : "") +
        '<div class="fb">' +
          '<button class="fbb ' + (f === "save" ? "good" : "") + '" data-fb="save:' + it.id + '">' + (on ? "Saved" : "Save") + '</button>' +
          '<button class="fbb ' + (f === "up" ? "mid" : "") + '" data-fb="up:' + it.id + '">Interested</button>' +
          '<button class="fbb ' + (f === "down" ? "bad" : "") + '" data-fb="down:' + it.id + '">Not for me</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  }

  function chipRow(label, items, activeList, act) {
    var h = '<div class="crow"><span class="clabel">' + esc(label) + '</span>';
    items.forEach(function (o) {
      var on = activeList.indexOf(o.v) > -1;
      h += '<button class="chip sm ' + (on ? "on" : "") + '" data-' + act + '="' + esc(o.v) + '">' + esc(o.l) + '</button>';
    });
    h += "</div>";
    return h;
  }

  function discover() {
    var fd = currentFeed(), rows = fd.rows;
    var regions = E.REGIONS.map(function (r) { return { v: r.id, l: r.label }; });
    var days = [1, 2, 3, 4, 5, 6, 0].map(function (d) { return { v: String(d), l: E.DOW[d] }; });
    var cats = Object.keys(EV.CATS).map(function (k) { return { v: k, l: EV.CATS[k].label }; });
    var sorts = [{ v: "match", l: "Best match" }, { v: "date", l: "Soonest" }, { v: "near", l: "Closest" }, { v: "cheap", l: "Cheapest" }];

    var h = '<div class="feedhead"><div>' +
      '<p class="eyebrow">What I\u2019ve found</p>' +
      '<p class="count">' + rows.length + ' things on in the next ' + S.horizon + ' days</p>' +
      '<p class="note">Across Brisbane, the Gold Coast, Sunshine Coast, Ipswich and the Scenic Rim. Nothing finished, nothing unverified.</p>' +
      '</div><div class="chips">' +
      '<button class="btn sm ghost" data-act="clear">Reset filters</button>' +
      '</div></div>';

    h += chipRow("Region", regions, S.regions, "rg");
    h += chipRow("Days", days, S.weekdays.map(String), "wd");
    h += chipRow("Interest", cats, S.cats, "cat");
    h += '<div class="crow"><span class="clabel">Sort</span>';
    sorts.forEach(function (o) {
      h += '<button class="chip sm ' + (S.sort === o.v ? "on" : "") + '" data-st="' + o.v + '">' + o.l + '</button>';
    });
    h += '<button class="chip sm ' + (S.freeOnly ? "on" : "") + '" data-act="free">Free only</button>';
    h += '<button class="chip sm ' + (S.horizon === 45 ? "on" : "") + '" data-act="horizon">Look 6 weeks out</button>';
    h += "</div>";

    h += rows.length
      ? '<div class="grid">' + rows.map(tile).join("") + "</div>"
      : '<div class="empty">Nothing matches those filters. Try clearing a region or a day.</div>';
    return h;
  }

  /* ---------------- my list ---------------- */
  function savedRows() {
    var out = [];
    S.saved.forEach(function (id) {
      var it = E.byId(id); if (!it) return;
      if (E.isFinished(it)) return;
      var occ = E.occurrences(it, E.today(), 120, 3);
      if (!occ.length) return;
      out.push({ item: it, next: occ[0], occ: occ, source: E.source(it) });
    });
    out.sort(function (a, b) { return a.next.d - b.next.d; });
    return out;
  }

  function listView() {
    var rows = savedRows();
    var t = E.today(), wk = E.addDays(t, 7);
    var g = { soon: [], week: [], later: [], any: [] };
    rows.forEach(function (r) {
      if (r.item.type === "weekly") g.any.push(r);
      else if (r.next.d <= E.addDays(t, 2)) g.soon.push(r);
      else if (r.next.d <= wk) g.week.push(r);
      else g.later.push(r);
    });

    var h = '<div class="feedhead"><div>' +
      '<p class="eyebrow">Your list</p>' +
      '<p class="count">' + rows.length + ' saved</p>' +
      '<p class="note">Everything you\u2019ve kept, soonest first \u2014 not tied to any one weekend.</p>' +
      '</div><div class="chips">' +
      '<button class="btn sm" data-act="import">Add something you saw</button>' +
      (rows.length ? '<button class="btn sm pri" data-act="icsall">Add all to calendar</button>' : "") +
      '</div></div>';

    if (!rows.length) {
      return h + '<div class="empty">Nothing saved yet. Hit <b>Save</b> on anything in Discover, or add something you spotted on Instagram yourself.</div>';
    }

    function sec(title, list) {
      if (!list.length) return "";
      var s = '<div class="lsec"><h4>' + esc(title) + '</h4><div class="lrows">';
      list.forEach(function (r) {
        var it = r.item;
        s += '<div class="lrow">' +
          '<div class="lsw">' + cover(it, false) + '</div>' +
          '<div class="linfo">' +
            '<b>' + esc(it.title) + (it.mine ? '<span class="mine">added by you</span>' : "") + '</b>' +
            '<span>' + esc(E.whenLine(it, r.next)) + ' \u00b7 ' + esc(E.money(it.priceMin, it.priceMax)) +
            ' \u00b7 ' + esc(E.regionLabel(E.regionOf(it))) + '</span>' +
          '</div>' +
          '<button class="btn sm ghost" data-open="' + it.id + '">Open</button>' +
          '<button class="iconb" data-ics="' + it.id + '" title="Add to calendar">\u2637</button>' +
          '<button class="iconb" data-unsave="' + it.id + '" title="Remove">\u2715</button>' +
        '</div>';
      });
      return s + "</div></div>";
    }

    h += sec("Next 48 hours", g.soon);
    h += sec("This week", g.week);
    h += sec("Further out", g.later);
    h += sec("On regularly \u2014 go whenever", g.any);
    return h;
  }

  /* ---------------- sources ---------------- */
  var TIER_COPY = {
    aggregator: ["Aggregators", "Polled on a schedule. These are the pages that list many events at once, which is why Scout watches them and not individual venues."],
    social: ["Social", "Instagram and TikTok, once you connect them. Read-only, and limited to what each platform\u2019s API actually permits."],
    manual: ["Your links", "Anything you paste or send in. Parsed once, never crawled."],
    verify: ["Official pages", "Fetched only to confirm a listing an aggregator surfaced, or to re-check it before it starts. Never crawled daily."]
  };

  function sourceRows(tier) {
    var list = EV.SOURCES.filter(function (s) { return s.tier === tier; });
    if (!list.length) return "";
    var h = '<div class="scard"><h4>' + esc(TIER_COPY[tier][0]) + '</h4>' +
      '<p class="cap">' + esc(TIER_COPY[tier][1]) + '</p>' +
      '<table class="stable"><thead><tr><th>Source</th><th>Region</th><th>Checked</th><th>Status</th></tr></thead><tbody>';
    list.forEach(function (s) {
      var live = s.status === "ok";
      h += "<tr><td><b>" + esc(s.name) + '</b><div class="dom">' + esc(s.domain) + "</div></td>" +
        "<td>" + esc(s.region === "multi" ? "All regions" : E.regionLabel(s.region)) + "</td>" +
        "<td>" + esc(s.cadence === "on demand" ? "On demand only" : "Every " + s.cadence) + "</td>" +
        '<td><span class="stat ' + (live ? "ok" : "off") + '">' + (live ? "\u25cf Live" : "\u25cb Not connected") + "</span>" +
        (s.tier === "social" && !live ? '<br><button class="btn sm" data-cx="' + s.id + '" style="margin-top:6px">Connect</button>' : "") +
        "</td></tr>";
    });
    return h + "</tbody></table></div>";
  }

  function sourcesView() {
    var r = EV.RUN;
    var h = '<div class="feedhead"><div>' +
      '<p class="eyebrow">Where this comes from</p>' +
      '<p class="count">' + r.aggregators + ' aggregators, checked twice a day</p>' +
      '<p class="note">Scout watches the pages that list many things at once. Individual venue pages are only opened to double-check a specific listing.</p>' +
      '</div></div>';

    h += '<div class="scard"><h4>Last run</h4>' +
      '<div class="statrow">' +
      '<div><b>' + r.sourcesChecked + '</b><span>aggregators checked</span></div>' +
      '<div><b>' + r.pagesFetched + '</b><span>pages fetched</span></div>' +
      '<div><b>' + r.candidates + '</b><span>candidates found</span></div>' +
      '<div><b>' + r.published + '</b><span>published</span></div>' +
      '<div><b>' + r.suppressed + '</b><span>held back</span></div>' +
      '<div><b>' + r.verifyFetches + '</b><span>verify fetches</span></div>' +
      '</div>' +
      '<p class="cap">' + r.pagesFetched + ' of those fetches were aggregator pages on a schedule. The other ' + r.verifyFetches +
      ' were one-off checks against an official page for a listing that needed confirming.</p></div>';

    h += '<div class="scard"><h4>Send Scout a link</h4>' +
      '<p class="cap">Paste anything \u2014 an event page, a venue, a post. Scout reads that one page and nothing else on the domain.</p>' +
      '<div class="row2" style="margin-top:12px">' +
      '<input class="inp" id="pasteurl" placeholder="https://…">' +
      '<button class="btn pri" data-act="paste">Read it</button></div>';
    if ((S.pasted || []).length) {
      h += '<div style="margin-top:14px">';
      S.pasted.forEach(function (p) {
        h += '<div class="heldrow"><b>' + esc(p.title) + "</b> \u00b7 <span>" + esc(p.note) + "</span></div>";
      });
      h += "</div>";
    }
    h += "</div>";

    h += sourceRows("aggregator") + sourceRows("social") + sourceRows("manual") + sourceRows("verify");

    if ((EV.SOCIAL || []).length) {
      h += '<div class="scard"><h4>How a post becomes a listing</h4>' +
        '<p class="cap">Worked examples, not live posts \u2014 Instagram and TikTok aren\u2019t connected yet.</p>';
      EV.SOCIAL.forEach(function (s) {
        h += '<div class="heldrow"><b>' + esc(s.handle) + "</b> \u00b7 <span>" + esc(s.platform) + "</span>" +
          '<p class="cap">\u201c' + esc(s.caption) + '\u201d</p><ul class="bul">';
        s.parsed.forEach(function (kv) { h += "<li>" + esc(kv[0]) + ": " + esc(kv[1]) + "</li>"; });
        h += "</ul>" + (s.match ? "" : '<p class="cap">Not enough in the caption to make a listing \u2014 held back.</p>') + "</div>";
      });
      h += "</div>";
    }
    return h;
  }

  /* ---------------- detail ---------------- */
  function detail(id) {
    var it = E.byId(id); if (!it) return "";
    var fd = currentFeed();
    var row = null;
    fd.rows.forEach(function (r) { if (r.item.id === id) row = r; });
    var occ = row ? row.occ : E.occurrences(it, E.today(), 120, 4);
    var next = occ[0] || { d: E.today(), open: it.open, close: it.close };
    var src = E.source(it);
    var sc = row ? row.score : E.score(it, next, S.profile, E.learnedMap(E.learn(S.feedback)));
    var on = S.saved.indexOf(it.id) > -1;
    var sims = row ? E.similar(it, fd.rows) : [];
    var noimg = !(it.img && it.img.url);

    var h = '<div class="modal" role="dialog" aria-label="' + esc(it.title) + '">' +
      '<button class="close" data-act="closemodal" aria-label="Close">\u2715</button>' +
      '<div class="mmedia">' + media(it, "", true) + "</div>" +
      (it.img && it.img.credit ? '<p class="credit">' + esc(it.img.credit) + "</p>"
        : '<p class="credit">Generated cover \u2014 ' + esc(src.domain) + " publishes no image Scout can legitimately reuse.</p>") +
      '<p class="cat">' + esc(EV.CATS[it.cat] ? EV.CATS[it.cat].label : it.cat) + " \u00b7 " +
      esc(E.regionLabel(E.regionOf(it))) + '</p>' +
      '<h2 class="mtitle">' + esc(it.title) + "</h2>" +
      '<p class="mdesc">' + esc(it.desc) + "</p>";

    h += '<div class="kv">' +
      "<div><label>When</label><p>" + esc(E.whenLine(it, next)) + "</p></div>" +

      (it.approxLoc ? '<br><span class="warnline">Address not confirmed</span>' : "") + "</p></div>" +
      "<div><label>Price</label><p>" + esc(E.money(it.priceMin, it.priceMax)) + "</p></div>" +

      "</div>";

    if (sims.length) {

  /* ---------------- onboarding ---------------- */

  /* ---------------- taste check ----------------
     Reactions to real listings, one per category, so the very first feed is
     already shaped by something learned instead of starting cold. */
  function calSet() {
    var seen = {}, out = [], t = E.today();
    EV.ITEMS.forEach(function (it) {
      if (out.length >= 8 || seen[it.cat] || it.mine) return;
      if (E.isFinished(it)) return;
      if (!E.occurrences(it, t, 45, 1).length) return;
      seen[it.cat] = 1;
      out.push(it);
    });
    return out;
  }

  function calibrate() {
    var set = calSet(), i = S.cal.i, it = set[i];
    if (!it) return "";
    var h = '<div class="center"><p class="eyebrow">Last thing</p>' +
      '<h1 class="h1">A quick taste check \u2014 ' + set.length + ' real listings.</h1>' +
      '<p class="sub">This teaches Scout faster than any settings screen. React honestly, skip anything you\u2019re unsure about.</p>' +
      '<div class="dots">' +
      set.map(function (x, n) {
        return '<span class="dot ' + (n < i ? "done" : n === i ? "now" : "") + '"></span>';
      }).join("") + "</div>" +
      '<div class="calcard"><div class="calmedia">' + media(it, "", true) + "</div>" +
      '<div class="calbody"><p class="cat">' + esc(EV.CATS[it.cat].label) + " \u00b7 " +
      esc(E.regionLabel(E.regionOf(it))) + " \u00b7 " + esc(E.money(it.priceMin, it.priceMax)) + "</p>" +
      '<h3 class="h3">' + esc(it.title) + "</h3>" +
      '<p class="mdesc" style="margin:0">' + esc(it.desc) + "</p></div></div>" +
      '<div class="calacts">' +
      '<button class="btn ghost" data-cal="skip">Skip</button>' +
      '<button class="btn" data-cal="down">Not for me</button>' +
      '<button class="btn" data-cal="up">Interested</button>' +
      '<button class="btn pri" data-cal="save">Love it</button>' +
      "</div>" +
      '<p class="note">' + (i + 1) + " of " + set.length + "</p></div>";
    return h;
  }

  /* ---------------- settings ---------------- */
  function settings() {

  /* ---------------- connect sheet ---------------- */
  var SOCIAL_COPY = {
    ig: {
      name: "Instagram",
      blurb: "Scout reads public posts through Instagram\u2019s official Graph API. That API is narrower than people expect, so here is exactly what it can and cannot do.",
      reads: ["Public posts carrying hashtags you nominate, like #brisbaneevents",

        "Posts from business accounts you name directly"],
      limits: ["No following feed, no DMs, no private accounts \u2014 the API does not expose them",
        "Hashtag search is capped at 30 unique hashtags per rolling 7 days",
        "Video posts using licensed audio omit the media URL, so those get a generated cover"]
    },
    tiktok: {
      name: "TikTok",
      blurb: "TikTok\u2019s open APIs are far more restricted. Scout uses the parts that are actually available to an app like this.",
      reads: ["Videos you save or send to Scout yourself", "Captions and the public embed for any link you paste",
        "Your own posted videos, if you authorise it"],
      limits: ["The Research API is licensed for non-commercial research only",
        "There is no general keyword search for third-party apps",
        "Pasting a link works today and needs no connection at all"]
    }
  };

  function connectSheet() {
    var c = SOCIAL_COPY[S.connect === "tiktok" ? "tiktok" : "ig"];
    return '<div class="modal">' +
      '<button class="close" data-act="cxclose" aria-label="Close">\u2715</button>' +

      '<p class="mdesc">' + esc(c.blurb) + "</p>" +
      '<div class="panelbox"><h4>What Scout will read</h4><ul>' +
      c.reads.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>" +
      '<div class="panelbox"><h4>What it cannot do</h4><ul>' +
      c.limits.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>" +
      '<div class="macts"><button class="btn ghost" data-act="cxclose">Cancel</button>' +
      '<button class="btn pri right" data-act="cxgo">Continue to ' + esc(c.name) + "</button></div></div>";
  }

  /* ---------------- add-it-yourself ----------------
     The honest version of "pull from Instagram": you hand Scout what you saw.
     It is stored as yours, marked unverified, and never dressed up as ingested. */
  function importModal() {
    return '<div class="modal">' +
      '<button class="close" data-act="impclose" aria-label="Close">\u2715</button>' +

      '<p class="mdesc">Put in what you know. Scout saves it to your list marked as yours and unverified \u2014 it will not invent a date, a price or a photo you did not give it.</p>' +
      '<div class="field"><label>What is it?</label><input class="inp" id="impt" placeholder="Twilight market at the old power station"></div>' +

      '<div class="field"><label>Link, if you have one</label><input class="inp" id="impu" placeholder="https://…"></div>' +
      '<div class="field"><label>Interest</label><div class="chips">' +
      Object.keys(EV.CATS).map(function (k) {
        return '<button class="chip sm ' + (S.impCat === k ? "on" : "") + '" data-impcat="' + k + '">' + esc(EV.CATS[k].label) + "</button>";

      '<div class="macts"><button class="btn ghost" data-act="impclose">Cancel</button>' +

  /* ---------------- shell ---------------- */
  function header() {
    var nav = [["discover", "Discover"], ["list", "My list"], ["sources", "Sources"]];
    var h = '<header class="hdr"><div class="hdrin">' +
      '<span class="brand">' +
      '<svg class="mark" viewBox="0 0 28 28" aria-hidden="true">' +
      '<circle cx="14" cy="14" r="12.4" fill="none" stroke="#1F4C4A" stroke-width="1.5"/>' +
      '<path d="M18.6 9.4 12.2 12.2 9.4 18.6 15.8 15.8Z" fill="#D99A2B"/>' +
      "</svg>Scout</span>" +
      '<nav class="nav">';
    nav.forEach(function (n) {
      var c = n[0] === "list" && S.saved.length ? ' <span class="ct">' + S.saved.length + "</span>" : "";
      h += '<button class="navb ' + (S.view === n[0] ? "on" : "") + '" data-view="' + n[0] + '">' + n[1] + c + "</button>";
    });
    h += '</nav><span class="spacer"></span><div class="pwrap">' +
      '<button class="avatar" data-act="menu" aria-label="Your account">' + esc(initials(S.profile.home)) + "</button>";
    if (S.menu) {
      h += '<div class="menu">' +
        '<div class="mhead"><b>' + esc(S.profile.home) + "</b><span>" + S.profile.interests.length +
        " interests \u00b7 " + S.feedback.length + " reactions</span></div>" +
        '<button class="menui" data-set="profile">Profile &amp; preferences</button>' +
        '<button class="menui" data-set="learned">What Scout learned</button>' +
        '<button class="menui" data-set="held">Held back<span class="k">' + (EV.RUN.suppressed + S.hidden.length) + "</span></button>" +
        '<button class="menui" data-set="activity">Agent activity</button>' +
        '<div class="mdiv"></div>' +
        '<button class="menui" data-view="sources">Sources</button>' +
        "</div>";
    }
    return h + "</div></div></header>";
  }

  function render() {
    var body;
    if (!S.onboarded) {
      body = S.cal ? calibrate() : onboard();
      root.innerHTML = body;
      return;
    }
    if (S.view === "list") body = listView();
    else if (S.view === "sources") body = sourcesView();
    else body = discover();

    var overlay = "";
    if (S.open) overlay = '<div class="backdrop" data-act="closemodal">' + detail(S.open) + "</div>";
    else if (S.sheet) overlay = '<div class="backdrop" data-act="closeset">' + settings() + "</div>";
    else if (S.connect) overlay = '<div class="backdrop" data-act="cxclose">' + connectSheet() + "</div>";
    else if (S.importing) overlay = '<div class="backdrop" data-act="impclose">' + importModal() + "</div>";

    root.innerHTML = header() + '<main class="wrap">' + body + "</main>" + overlay;
  }

  /* ---------------- events ---------------- */
  function toggle(list, v) {
    var i = list.indexOf(v);
    if (i > -1) list.splice(i, 1); else list.push(v);
  }
  function react(id, type) {
    S.feedback = S.feedback.filter(function (f) { return f.id !== id; });
    S.feedback.push({ id: id, type: type, at: E.iso(E.today()) });
    if (type === "save") { if (S.saved.indexOf(id) < 0) S.saved.push(id); }
    if (type === "down") {
      if (S.hidden.indexOf(id) < 0) S.hidden.push(id);
      S.saved = S.saved.filter(function (x) { return x !== id; });
    }
  }
  function icsOne(id) {
    var it = E.byId(id); if (!it) return;
    var occ = E.occurrences(it, E.today(), 120, 1);
    if (!occ.length) return;
    download(id + ".ics", icsFor([{ item: it, next: occ[0] }]));
  }
  function val(id) {
    var el = document.getElementById(id);
    return el ? el.value.trim() : "";
  }

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest(
      "[data-view],[data-act],[data-open],[data-fb],[data-rg],[data-wd],[data-cat],[data-st],[data-int],[data-bud],[data-bk],[data-tp],[data-tab],[data-set],[data-unlearn],[data-cal],[data-cx],[data-ics],[data-unsave],[data-impcat]"
    );
    if (!t) return;
    var d = t.dataset;

    if (d.act === "closemodal" || d.act === "closeset" || d.act === "cxclose" || d.act === "impclose") {
      if (ev.target !== t && t === ev.target.closest(".backdrop")) return;
    }
    if (t.classList.contains("backdrop") && ev.target !== t) return;

    ev.preventDefault();

    if (d.view) { S.view = d.view; S.menu = false; S.open = null; }
    else if (d.open) { S.open = d.open; }
    else if (d.fb) {
      var parts = d.fb.split(":");
      react(parts[1], parts[0]);
      if (parts[0] === "down") S.open = null;
    }
    else if (d.rg) { toggle(S.regions, d.rg); }
    else if (d.wd) { toggle(S.weekdays, +d.wd); }
    else if (d.cat) { toggle(S.cats, d.cat); }
    else if (d.st) { S.sort = d.st; }
    else if (d.int) { toggle(S.profile.interests, d.int); }
    else if (d.bud) { S.profile.budget = +d.bud; }
    else if (d.bk) { S.profile.booking = d.bk; }
    else if (d.tp) { S.profile.travelPref = d.tp; }
    else if (d.tab) { S.tab = d.tab; }
    else if (d.set) { S.sheet = 1; S.tab = d.set; S.menu = false; }
    else if (d.unlearn) { 
      var k = d.unlearn;
      S.feedback = S.feedback.filter(function (f) {
        var it = E.byId(f.id);
        if (!it) return true;
        if (k.indexOf("cat:") === 0) return "cat:" + it.cat !== k;
        if (k.indexOf("tag:") === 0) return (it.tags || []).indexOf(k.slice(4)) < 0;
        return true;
      });
    }
    else if (d.cx) { S.connect = d.cx; }
    else if (d.ics) { icsOne(d.ics); return; }
    else if (d.unsave) { S.saved = S.saved.filter(function (x) { return x !== d.unsave; }); }
    else if (d.impcat) { S.impCat = d.impcat; }
    else if (d.cal) {
      var set = calSet(), cur = set[S.cal.i];
      if (cur && d.cal !== "skip") react(cur.id, d.cal);
      if (S.cal.i + 1 >= set.length) {
        S.cal = null; S.onboarded = true; S.view = "discover";
      } else {
        S.cal.i += 1;
      }
    }
    else if (d.act) {
      var a = d.act;
      if (a === "menu") S.menu = !S.menu;
      else if (a === "closemodal") S.open = null;
      else if (a === "closeset") { S.sheet = null; }
      else if (a === "cxclose") S.connect = null;
      else if (a === "impclose") S.importing = false;
      else if (a === "import") S.importing = true;
      else if (a === "clear") { S.regions = []; S.weekdays = []; S.cats = []; S.freeOnly = false; S.sort = "match"; S.horizon = 14; }
      else if (a === "free") S.freeOnly = !S.freeOnly;
      else if (a === "horizon") S.horizon = S.horizon === 45 ? 14 : 45;
      else if (a === "next") {
        if (S.step === 0) {
          var hv = val("homein");
          if (hv) { S.profile.home = hv; S.profile.homeShort = hv.split(",")[0]; }
          S.step = 1;
        } else {
          S.cal = { i: 0 };
        }
      }
      else if (a === "back") S.step = 0;
      else if (a === "skipall") { S.cal = { i: 0 }; }
      else if (a === "saveset") {
        var hs = val("homeset");
        if (hs) { S.profile.home = hs; S.profile.homeShort = hs.split(",")[0]; }
        S.sheet = null;
      }
      else if (a === "reset") {
        try { localStorage.removeItem(KEY); } catch (e) {}
        S = defaults();
      }
      else if (a === "rerun") { S.sheet = null; }
      else if (a === "cxgo") {
        var id = S.connect;
        EV.SOURCES.forEach(function (s) {
          if (s.id === id) { s.status = "ok"; s.lastRun = "2026-09-02T12:55:00+10:00"; }
        });
        S.social = true; S.connect = null; S.view = "sources";
      }
      else if (a === "paste") {
        var u = val("pasteurl");
        if (u) {
          var dom = u.replace(/^https?:\/\//, "").split("/")[0];
          var hit = null;
          EV.ITEMS.forEach(function (it) {
            if (!hit && it.src && it.src.url.indexOf(dom) > -1) hit = it;
          });
          if (hit) {
            if (S.saved.indexOf(hit.id) < 0) S.saved.push(hit.id);
            S.pasted.unshift({ title: hit.title, note: "matched a listing Scout already has \u2014 saved to your list" });
          } else {
            S.pasted.unshift({ title: dom, note: "queued for review \u2014 Scout will read this one page and nothing else on the domain" });
          }
        }
      }
      else if (a === "impsave") {
        var title = val("impt");
        if (title) {
          var dt = val("impd"), venue = val("impv") || "Location not given", link = val("impu");
          var nid = "mine-" + hash(title + dt).toString(36);
          var item = {
            id: nid, title: title, cat: S.impCat || "festival", mine: true,
            venue: venue, addr: venue, lat: EV.HOME.lat, lng: EV.HOME.lng, approxLoc: true,
            priceMin: null, priceMax: null, booking: "none", indoor: false, effort: 1,
            tags: ["added by you"],
            src: { id: "inbox", url: link || "" },
            verified: null, confidence: 0.4,
            desc: "You added this yourself. Scout has not verified the date, price or location \u2014 check the source before you go.",
            facts: [["Added", "by you on " + E.iso(E.today())]]
          };
          if (/^\d{4}-\d{2}-\d{2}$/.test(dt)) {
            item.type = "dated";
            item.dates = [{ d: dt, open: "10:00", close: "14:00" }];
          } else {
            item.type = "season";
            item.from = E.iso(E.today());
            item.to = E.iso(E.addDays(E.today(), 90));
            item.open = "10:00"; item.close = "14:00";
            item.facts.push(["Date", "not given \u2014 saved as an open idea"]);
          }
          EV.ITEMS.push(item);
          S.imported.push(item);
          S.saved.push(nid);
          S.importing = false;
          S.view = "list";
        }
      }
    }

    save();
    render();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (S.open || S.sheet || S.connect || S.importing || S.menu) {
      S.open = null; S.sheet = null; S.connect = null; S.importing = false; S.menu = false;
      render();
    }
  });

  render();
})();

</script>
</body>
</html>
